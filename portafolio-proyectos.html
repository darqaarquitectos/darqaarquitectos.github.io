<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portafolio de Proyectos | DARQA Arquitectos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .viewer-header {
            height: 72px;
            background: #0b0b0b;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 20px;
            letter-spacing: 3px;
        }

        .brand-subtitle {
            display: block;
            font-size: 8px;
            letter-spacing: 2px;
            color: #a8a8a8;
            margin-top: 3px;
        }

        .back-button {
            text-decoration: none;
            color: #ffffff;
            border: 1px solid #ffc400;
            padding: 10px 17px;
            font-size: 11px;
            letter-spacing: 1px;
            transition: .25s ease;
        }

        .back-button:hover {
            background: #ffc400;
            color: #000000;
        }

        .viewer {
            min-height: 100vh;
            padding-top: 92px;
            padding-bottom: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-container {
            width: min(1100px, 90vw);
            background: #111111;
            border: 1px solid #2d2d2d;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            overflow: hidden;
        }

        .page-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 86px;
            background: rgba(8,8,8,.97);
            border-top: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 100;
        }

        .control-button {
            min-width: 110px;
            padding: 12px 18px;
            border: 1px solid #ffc400;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: .25s ease;
        }

        .control-button:hover:not(:disabled) {
            background: #ffc400;
            color: #000000;
        }

        .control-button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .page-number {
            min-width: 100px;
            text-align: center;
            color: #ffc400;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {

            .viewer-header {
                height: 62px;
                padding: 0 15px;
            }

            .brand-name {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 6px;
            }

            .brand img {
                width: 34px;
                height: 34px;
            }

            .back-button {
                padding: 8px 10px;
                font-size: 9px;
            }

            .viewer {
                padding-top: 75px;
                padding-bottom: 95px;
            }

            .page-container {
                width: 96vw;
            }

            .controls {
                height: 78px;
                gap: 8px;
            }

            .control-button {
                min-width: 90px;
                padding: 10px 8px;
                font-size: 9px;
            }

            .page-number {
                min-width: 75px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="viewer-header">

        <a href="portafolio.html" class="brand">

            <img src="assets/darqa-logo.png" alt="DARQA Arquitectos">

            <div>
                <div class="brand-name">DARQA</div>

                <span class="brand-subtitle">
                    ARQUITECTOS · PROYECTOS · GESTIÓN
                </span>
            </div>

        </a>

        <a href="portafolio.html" class="back-button">
            VOLVER AL PORTAFOLIO
        </a>

    </header>


    <main class="viewer">

        <div class="page-container">

            <img
                id="portfolioPage"
                src="assets/portafolio-darqa-01.jpg"
                alt="Portafolio de proyectos DARQA Arquitectos"
            >

        </div>

    </main>


    <div class="controls">

        <button
            id="previousButton"
            class="control-button"
            onclick="previousPage()"
        >
            ← ANTERIOR
        </button>

        <div
            id="pageNumber"
            class="page-number"
        >
            PÁGINA 1 / 67
        </div>

        <button
            id="nextButton"
            class="control-button"
            onclick="nextPage()"
        >
            SIGUIENTE →
        </button>

    </div>


    <script>

        const totalPages = 67;

        let currentPage = 1;

        const portfolioPage =
            document.getElementById("portfolioPage");

        const pageNumber =
            document.getElementById("pageNumber");

        const previousButton =
            document.getElementById("previousButton");

        const nextButton =
            document.getElementById("nextButton");


        function showPage(page) {

            currentPage = page;

            const pageFormatted =
                String(currentPage).padStart(2, "0");

            portfolioPage.src =
                `assets/portafolio-darqa-${pageFormatted}.jpg`;

            pageNumber.textContent =
                `PÁGINA ${currentPage} / ${totalPages}`;

            previousButton.disabled =
                currentPage === 1;

            nextButton.disabled =
                currentPage === totalPages;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        function nextPage() {

            if (currentPage < totalPages) {
                showPage(currentPage + 1);
            }

        }


        function previousPage() {

            if (currentPage > 1) {
                showPage(currentPage - 1);
            }

        }

    </script>

</body>
</html>
